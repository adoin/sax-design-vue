name: Deploy documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: pages
            docs-base: /sax-design-vue/
            play-base: /sax-design-vue/play/
          - target: server
            docs-base: /
            play-base: /play/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Pages
        if: matrix.target == 'pages'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install and build docs + playground
        shell: bash
        env:
          VUEPRESS_BASE: ${{ matrix.docs-base }}
          PLAY_BASE: ${{ matrix.play-base }}
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter sax-design-vue-iconify build
          pnpm run build:theme
          pnpm -C play build
          pnpm run docs:build
          mkdir -p docs/.vuepress/dist/play
          cp -r play/dist/* docs/.vuepress/dist/play/

      - name: Upload Pages artifact
        if: matrix.target == 'pages'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vuepress/dist

      - name: Upload server artifact
        if: matrix.target == 'server'
        uses: actions/upload-artifact@v4
        with:
          name: server-site
          path: docs/.vuepress/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-server:
    environment:
      name: website
      url: https://sax-design.emssion.com
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4

      - name: Download server artifact
        uses: actions/download-artifact@v5
        with:
          name: server-site
          path: server-site

      - name: Deploy and verify server release
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: bash scripts/deploy-site.sh server-site

  cleanup-artifacts:
    runs-on: ubuntu-latest
    needs: [deploy, deploy-server]
    permissions:
      actions: write
    steps:
      - name: Keep only the 2 newest workflow artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const keep = 2
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })

            const artifacts = data.artifacts
              .filter((artifact) => !artifact.expired)
              .sort(
                (a, b) =>
                  new Date(b.created_at).getTime() -
                  new Date(a.created_at).getTime()
              )

            for (const artifact of artifacts.slice(keep)) {
              core.info(`Deleting artifact ${artifact.id} (${artifact.name})`)
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              })
            }

  cleanup-workflow-runs:
    runs-on: ubuntu-latest
    needs: [deploy, deploy-server]
    permissions:
      actions: write
    steps:
      - name: Keep only the 2 newest workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const keep = 2
            const allRuns = []
            let page = 1

            while (true) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page,
              })

              allRuns.push(...data.workflow_runs)
              if (data.workflow_runs.length < 100) break
              page += 1
            }

            const runs = allRuns
              .filter((run) => run.status === 'completed')
              .sort(
                (a, b) =>
                  new Date(b.created_at).getTime() -
                  new Date(a.created_at).getTime()
              )

            for (const run of runs.slice(keep)) {
              core.info(`Deleting workflow run ${run.id} (${run.name})`)
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              })
            }
