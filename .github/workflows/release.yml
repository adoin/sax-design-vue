name: Release npm package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, for example v2.7.0'
        required: true
        type: string
      target:
        description: 'Exact release source commit or branch'
        required: true
        default: main
        type: string
      npm_already_published:
        description: 'Only finalize a version whose npm upload already succeeded'
        default: false
        type: boolean
      deploy_docs:
        description: 'Deploy current documentation; disable for historical backfills'
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write
  actions: write

env:
  TAG_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

concurrency:
  group: npm-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target || github.sha }}

      - name: Validate release source
        id: source
        run: |
          node -e "const v = require('./packages/sax-design-vue/package.json').version; if (process.env.TAG_VERSION !== 'v' + v) throw new Error('Release tag must match source package version')"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "GIT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node and npm registry
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Enable pnpm
        if: github.event_name != 'workflow_dispatch' || !inputs.npm_already_published
        run: corepack enable

      - name: Use npm with provenance support
        if: github.event_name != 'workflow_dispatch' || !inputs.npm_already_published
        run: npm install --global npm@latest

      - name: Publish package
        if: github.event_name != 'workflow_dispatch' || !inputs.npm_already_published
        run: bash scripts/publish.sh

      - name: Reuse confirmed npm upload
        if: github.event_name == 'workflow_dispatch' && inputs.npm_already_published
        run: echo "Finalizing $TAG_VERSION after a previously successful npm publish; no duplicate upload or availability polling."

  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release changelog
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.publish.outputs.source_sha }}

      - name: Prepare release notes
        run: node scripts/release-notes.mjs "$TAG_VERSION" "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ needs.publish.outputs.source_sha }}
          GH_REPO: ${{ github.repository }}
          MARK_LATEST: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_docs }}
        run: |
          if gh release view "$TAG_VERSION" >/dev/null 2>&1; then
            gh release edit "$TAG_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --title "sax-design-vue $TAG_VERSION" --latest="$MARK_LATEST"
          elif gh api "repos/$GH_REPO/git/ref/tags/$TAG_VERSION" >/dev/null 2>&1; then
            gh release create "$TAG_VERSION" --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" --title "sax-design-vue $TAG_VERSION" --latest="$MARK_LATEST"
          else
            gh release create "$TAG_VERSION" --target "$RELEASE_SOURCE" --notes-file "$RUNNER_TEMP/release-notes.md" --title "sax-design-vue $TAG_VERSION" --latest="$MARK_LATEST"
          fi

      - name: Deploy documentation for manual release
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_docs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main
